<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="290" y1="182" x2="378" y2="330">
      <stop offset="0" stop-color="#FED7AA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="send" gradientUnits="userSpaceOnUse" x1="162" y1="300" x2="254" y2="214">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FFEDD5"/>
    </linearGradient>

    <!-- E + N (top & bottom bars), reused for depth layers -->
    <g id="strokes" fill="none" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 182 H138 V330 H218"/>
      <path d="M290 330 V182"/>
      <path d="M378 330 V182"/>
      <path d="M290 182 L378 330"/>
    </g>
    <!-- Send arrow = E's middle bar, shooting out to the right -->
    <path id="arrow" d="M162 262 L254 214 L212 300 L194 274 Z"/>
    <path id="braces" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
          d="M134 168 C110 168 112 186 112 206 V234 C112 248 104 256 94 256 C104 256 112 264 112 278 V306 C112 326 110 344 134 344
             M378 168 C402 168 400 186 400 206 V234 C400 248 408 256 418 256 C408 256 400 264 400 278 V306 C400 326 402 344 378 344"/>
    <linearGradient id="brace" gradientUnits="userSpaceOnUse" x1="0" y1="168" x2="0" y2="344">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Soft colour blobs behind the glass -->
  <g clip-path="url(#clip)" filter="url(#blobBlur)">
    <circle cx="130" cy="120" r="140" fill="#F97316" opacity="0.55"/>
    <circle cx="410" cy="410" r="160" fill="#06B6D4" opacity="0.45"/>
  </g>

  <!-- Glass panel -->
  <g filter="url(#glassShadow)">
    <rect x="72" y="72" width="368" height="368" rx="84" fill="#FFFFFF" fill-opacity="0.1"
          stroke="url(#glassStroke)" stroke-width="2.5"/>
  </g>
  <path d="M156 72 H356 A84 84 0 0 1 440 156 V200 H72 V156 A84 84 0 0 1 156 72 Z" fill="url(#shine)"/>

  <g transform="translate(256 256) scale(0.7) translate(-258 -256)">
  <!-- Subtle 3D: soft shadow + translucent depth -->
  <use href="#strokes" stroke="#000000" opacity="0.4" transform="translate(0 18)" filter="url(#soft)"/>
  <use href="#strokes" stroke="#334155" opacity="0.8" transform="translate(0 7)"/>
  <use href="#arrow" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round"
       opacity="0.4" transform="translate(0 18)" filter="url(#soft)"/>
  <use href="#arrow" fill="#9A3412" stroke="#9A3412" stroke-width="8" stroke-linejoin="round"
       opacity="0.7" transform="translate(0 7)"/>

  <!-- NE front faces -->
  <g filter="url(#glow)" fill="none" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 182 H138 V330 H218" stroke="#FFFFFF"/>
    <path d="M290 330 V182" stroke="#FFFFFF"/>
    <path d="M378 330 V182" stroke="#FFFFFF"/>
    <!-- Folded ribbon diagonal -->
    <path d="M290 182 L378 330" stroke="url(#fold)"/>
  </g>
  <!-- Glowing send arrow -->
  <use href="#arrow" fill="url(#send)" stroke="url(#send)" stroke-width="8"
       stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Plane fold + inner wing -->
  <path d="M194 274 L254 214 L202 286 Z" fill="#C2410C" opacity="0.55"/>
  <path d="M194 274 L254 214" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Braces: depth + glow -->
  <use href="#braces" stroke="#000000" opacity="0.4" transform="translate(0 16)" filter="url(#soft)"/>
  <use href="#braces" stroke="#9A3412" opacity="0.7" transform="translate(0 6)"/>
  <use href="#braces" stroke="url(#brace)" filter="url(#glow)"/>
</svg>
