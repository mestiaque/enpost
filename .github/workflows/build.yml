# Tests ENPost on Ubuntu and Windows and bundles .deb, AppImage and the Windows installer.
# Pushing a tag like v0.1.0 publishes a GitHub Release with those files.
name: build

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            timeout 300 sudo apt-get $APT update &&
            timeout 900 sudo -E apt-get $APT install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
              libayatana-appindicator3-dev libssl-dev libxdo-dev file patchelf && exit 0
            echo "apt attempt $i failed, retrying…"; sleep 15
          done
          exit 1

      # The pnpm version comes from package.json (packageManager).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --release --workspace
      - name: Generated IPC bindings are committed and current
        shell: bash
        run: git diff --exit-code -- src/types/bindings

      - name: Bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: enpost-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe

  release:
    name: Publish release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-and-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Collect files
        run: |
          mkdir -p files
          find out -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' \) -exec cp {} files/ \;
          ls -l files
          test -n "$(ls files)"
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
